<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login copy.css">

</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <!-- Setelah login menuju beranda.html -->
        <form class="login-form" action="beranda.html">

            <label>• &nbsp;Name</label>
            <input type="text" name="name" required>

            <label>• &nbsp;Password</label>
            <input type="password" name="password" required>

            <p class="forgot">
                <a href="#">Forgot Password ?</a>
            </p>

            <button type="submit">
                Register
            </button>

            <p class="register-now">
                Don't have an account ?
                <a href="register copy.html">Register Now</a>
            </p>

        </form>

    </div>

</body>
</html>
